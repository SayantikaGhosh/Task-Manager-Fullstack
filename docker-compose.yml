services:
  backend:
    build:
      context: ./backend
    container_name: task-manager-backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
    container_name: task-manager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
